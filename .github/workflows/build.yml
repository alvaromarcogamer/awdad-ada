name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Archivos del repositorio
        run: find . -path ./.git -prune -o -type f -print | sort
      - name: Compilar
        run: mvn -B clean package
      - name: Comprobar JAR
        run: |
          unzip -l target/ServerSuite-1.0.0.jar
          unzip -p target/ServerSuite-1.0.0.jar plugin.yml | grep '^main:'
          javap -v -cp target/classes net.survival.suite.SuitePlugin | grep 'major version'
      - uses: actions/upload-artifact@v4
        with:
          name: ServerSuite-1.0.0
          path: target/ServerSuite-1.0.0.jar
          if-no-files-found: error
